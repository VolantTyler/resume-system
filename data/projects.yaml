- id: glen-rock-ai-guild
  name: Glen Rock AI Guild
  organization: Independent R&D
  timeframe: "2026"
  problem: A community AI club needed a mention-driven Slack assistant that could answer simple questions immediately while spinning up the right domain specialists for deeper technical, data, insurance, and writing work—without requiring a public webhook URL.
  solution: Built a CrewAI multi-agent backend with a Supervisor that classifies Slack mentions into simple vs detailed intents, dynamically selects Engineer / Data Analyst / Insurance SME / Web Designer / Writer agents, runs on Google Gemini with model failover, and exposes FastAPI health/roster endpoints plus Google Docs/Drive sync with mock fallback.
  technologies:
    - CrewAI
    - Google Gemini
    - FastAPI
    - Slack Bolt
    - Socket Mode
    - Python
    - Pydantic
    - Google Docs API
    - Google Drive API
    - AgentOps
  outcomes:
    - Intent-based Supervisor routing with fast-path simple answers and dynamic specialist crew assembly for complex prompts.
    - Slack Socket Mode integration (no public webhook/ngrok) with threaded Guild reports and `/agents-list` roster card.
    - Google Docs/Drive create-and-sync path with personal OAuth or service-account credentials and mock fallback when unset.
  related_accomplishment_ids:
    - graic-crewai-supervisor-routing
    - graic-slack-fastapi-backend
    - graic-gdocs-drive-integration
  portfolio_visible: true
  resume_relevance: applied-ai-developer, agentic-ai-engineer, agentic-software-engineer, forward-deployed-engineer, full-stack-engineer
- id: development-knowledge-vault
  name: Development Knowledge Vault
  organization: Independent R&D
  timeframe: "2026"
  problem: AI coding agents on new projects rediscover the same deploy, auth, eval, and security practices instead of reusing distilled patterns from prior agent and product repos.
  solution: Built a Vercel-hosted MCP server that exposes markdown engineering patterns as tools (`list_patterns`, `get_pattern`), with dual auth on one URL—Clerk OAuth for cloud clients and an optional shared-secret Bearer for local/curl—so Cursor, Gemini Spark, and other MCP clients can pull operational preferences and prior solutions at request time.
  technologies:
    - Next.js
    - Vercel
    - MCP
    - Clerk
    - OAuth
    - TypeScript
    - Markdown
  outcomes:
    - Production MCP endpoint serving a curated pattern corpus (deploy, auth, evals, PII, multi-agent, YAML SOT, and related practices).
    - Dual-acceptance auth documented and shipped so the same URL works for OAuth clients and Bearer-configured IDE/curl without smart surface detection.
    - Personal Cursor skill (`knowledge-vault`) that steers agents to query the vault before inventing process.
  related_accomplishment_ids:
    - knowledge-vault-mcp-server
    - knowledge-vault-dual-auth
  portfolio_visible: true
  resume_relevance: applied-ai-developer, agentic-ai-engineer, agentic-software-engineer, forward-deployed-engineer, full-stack-engineer
