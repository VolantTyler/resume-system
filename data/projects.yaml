- id: stack-overlord
  name: Stack Overlord
  organization: Independent R&D
  timeframe: "2026"
  problem: A merge can succeed in GitHub while its post-merge deployment fails silently (credentials, quotas, environment config), leaving production stale with no clear notification signal—built for OpenAI Build Week 2026's Developer Tools track under tight hackathon constraints, primarily via Codex/GPT-5.6.
  solution: Built a Next.js/TypeScript command center that ingests signed GitHub Actions webhooks into a durable Postgres/Drizzle ledger (GitHub stays the source of truth for pass/fail), diagnoses failures with the OpenAI Responses API (GPT-5.6) using evidence citations, confidence levels, and verification steps, alerts Slack, and ships a deterministic credential-free demo mode so judges can exercise the whole flow.
  technologies:
    - Codex
    - GPT-5.6
    - Next.js
    - React
    - TypeScript
    - Tailwind CSS
    - shadcn/ui
    - Postgres
    - Drizzle ORM
    - OpenAI Responses API
    - Vercel
    - Playwright
    - Vitest
    - GitHub Actions
    - Slack Bolt
  outcomes:
    - Signed, idempotent GitHub webhook ingestion into a Postgres ledger, with GitHub kept as sole source of truth for workflow status.
    - GPT-5.6 failure diagnosis with evidence citations, confidence levels, and ordered verification steps, plus Slack failure alerts.
    - Deterministic, credential-free demo mode with fixture replay so OpenAI Build Week judges could evaluate the product without GitHub/OpenAI credentials.
    - Responsive (desktop/mobile) dashboard covered by Playwright and Vitest tests.
  related_accomplishment_ids:
    - stack-overlord-openai-build-week
    - stack-overlord-webhook-ledger
    - stack-overlord-ai-failure-diagnosis
    - stack-overlord-demo-mode
  portfolio_visible: true
  portfolio_headline: Stack Overlord
  portfolio_blurb: A CI/CD command center that catches silent post-merge deployment failures—ingesting signed GitHub webhooks into a durable Postgres ledger and diagnosing failures with cited, confidence-scored GPT-5.6 analysis that never overrides GitHub's own pass/fail verdict.
